<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>factorial calculator</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #472bd8;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      .container {
        background: #ffffff;
        padding: 25px 30px;
        border-radius: 12px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        text-align: center;
        width: 300px;
      }

      h3 {
        margin-bottom: 15px;
        color: #333;
      }

      input {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 8px;
        margin-bottom: 15px;
        font-size: 16px;
        outline: none;
      }

      input:focus {
        border-color: #4caf50;
      }

      button {
        width: 100%;
        padding: 10px;
        background: #212bb9;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s;
      }

      #output {
        margin-top: 15px;
        font-weight: bold;
        color: #222;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h3>Factorial Calculator</h3>
      <input id="txtInput" placeholder="Enter number" />
      <div><button id="submit">Validate & calculate</button></div>

      <div id="output"></div>
    </div>
  </body>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const txtInput = document.getElementById("txtInput");
      const button = document.getElementById("submit");
      const output = document.getElementById("output");

      button.addEventListener("click", function () {
        const num = parseInt(txtInput.value);

        if (isNaN(num) || num < 0) {
          output.innerText = "not a number";
          return;
        }

        let fact = 1;
        for (let i = 1; i <= num; i++) {
          fact *= i;
        }
        output.innerText = `Factorial of ${num} is ${fact}`;
      });
    });
  </script>
</html>
