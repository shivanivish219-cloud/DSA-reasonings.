  <script>
    const charInput = document.getElementById("char-input");
    const resultInput = document.getElementById("resultInput");
    const lcBtnElem = document.getElementById("LC-btn");
    const ucBtnElem = document.getElementById("UC-btn");
    const scBtnElem = document.getElementById("SC-btn");
    const ccBtnElem = document.getElementById("CC-btn");

    lcBtnElem.addEventListener("click", () => {
      // LC logic
      resultInput.value = charInput.value.toLowerCase();
    });

    ucBtnElem.addEventListener("click", () => {
      // UC logic
      resultInput.value = charInput.value.toUpperCase();
    });

    scBtnElem.addEventListener("click", () => {
      // SC logic
    });
    ccBtnElem.addEventListener("click", () => {
      // CC logic
      resultInput.value = charInput.value.to;
    });
