<script>
  function doTaskUsingCb(callback) {
    setTimeout(() => {
      callback("First call");
      callback("Second call");
      callback("Third call");
      callback("Fourth call");
      callback("Fifth call");
      callback("Sixth call");
      callback("Seventh call");
    }, 4000);
  }

  const cbFunc = (result) => {
    console.log("Callback:", result);
  };

  doTaskUsingCb(cbFunc);

  function fetchDataUsingPromises() {
    return new Promise((resolve, reject) => {
      resolve("Data loaded");
      resolve("Data loaded again"); // ignored
      reject("Error occurred"); // ignored
    });
  }

  fetchDataUsingPromises().then((data) => {
    console.log("Promise:", data);
  });
</script>
